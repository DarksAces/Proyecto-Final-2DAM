<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARte | Captura el Mundo en 3D</title>
    <meta name="description" content="ARte: Sistema avanzado de captura y visualización 3D mediante Realidad Aumentada.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Cargamos el componente de Google para ver 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <div class="background-glow"></div>
        
        <nav>
            <div class="logo">AR<span>te</span></div>
            <div class="nav-links">
                <a href="#gallery">Galería 3D</a>
                <a href="#" class="btn-primary">Nueva Captura</a>
            </div>
        </nav>

        <main>
            <section class="hero-simple">
                <h1>Tu Galería de <span>Objetos 3D</span></h1>
                <p>Visualiza y explora tus capturas en tiempo real.</p>
            </section>

            <section id="gallery" class="gallery-section">
                <div id="models-container" class="models-grid">
                    <!-- Los modelos se cargarán aquí dinámicamente -->
                    <div class="loading-state">Conectando con Firebase...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 ARte Project - 2º DAM. Todos los derechos reservados.</p>
        </footer>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
