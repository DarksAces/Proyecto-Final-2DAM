<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARte | Captura el Mundo en 3D</title>
    <meta name="description" content="ARte: Sistema avanzado de captura y visualización 3D mediante Realidad Aumentada.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Cargamos el componente de Google para ver 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <div class="background-glow"></div>
        
        <nav>
            <div class="logo">AR<span>te</span></div>
            <div class="nav-links">
                <a href="#gallery">Galería 3D</a>
                <a href="#" class="btn-primary">Nueva Captura</a>
            </div>
        </nav>

        <main class="immersive-layout">
            <!-- Escenario Principal -->
            <section class="viewer-stage">
                <!-- Botón Izquierda -->
                <button id="prev-btn" class="nav-arrow left">❮</button>
                
                <div class="stage-container">
                    <model-viewer 
                        id="main-viewer"
                        src="" 
                        ar 
                        ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        touch-action="pan-y" 
                        shadow-intensity="2" 
                        exposure="1.2"
                        environment-image="neutral"
                        auto-rotate 
                        rotation-speed="10deg"
                        interaction-prompt="auto">
                        
                        <div id="model-name-overlay" class="model-name-tag">Cargando...</div>
                        
                        <div class="stage-controls">
                            <button id="fullscreen-btn" class="control-btn">⛶ Pantalla Completa</button>
                            <button slot="ar-button" class="ar-button-stage">🕶️ Ver en AR</button>
                        </div>
                    </model-viewer>
                </div>

                <!-- Botón Derecha -->
                <button id="next-btn" class="nav-arrow right">❯</button>
            </section>

            <!-- Galería Inferior (Selector) -->
            <section class="selection-gallery">
                <div class="gallery-header">
                    <h2>Colección 3D <span>ARte</span></h2>
                </div>
                <div id="thumbnails-container" class="thumbnails-scroll">
                    <div class="loading-state">Cargando colección...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 ARte Project - 2º DAM. Todos los derechos reservados.</p>
        </footer>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
