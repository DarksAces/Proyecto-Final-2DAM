name: arte_go_map
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # flutter_map: ^6.1.0
  # latlong2: ^0.9.0
  maplibre_gl: ^0.26.0
  cupertino_icons: ^1.0.2
  geolocator: ^14.0.2 # Warning: Downgrading might be safer if 14 has issues, but keeping high for now
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_app_check: ^0.4.3
  flutter_local_notifications: 17.2.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  http: ^1.6.0
  camera: ^0.12.0
  permission_handler: ^12.0.1
  model_viewer_plus: ^1.8.0
  path_provider: ^2.1.2
  path: ^1.9.0
  socket_io_client: ^3.1.4
  video_player: ^2.11.1
  chewie: ^1.13.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1
  showcaseview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
  fullscreen: true
